name = "udyan-leaf-website"
main = "src/index.js"
compatibility_date = "2026-03-01"

[[rules]]
type = "Text"
globs = ["*.html"]

[vars]
DISCORD_CLIENT_ID = "1536683890142482433"
SHEET_ID = "1RyT3k2L8jfFJt-2vtW8cxLyP7U2kEPE-qxJiNkOldKo"
SHEET_GID = "0"
# GID of the operations sheet tab (airports/hubs, fleet, paycheck status).
# Replace with the actual GID from that tab's URL — the number after
# "gid=" when you have that sheet open in your browser.
OPERATIONS_SHEET_GID = "337983586"
# GID of the manually-submitted flight log sheet tab (Timestamp, Discord
# Username, Roblox Username, Aircraft Flown, Time Flown, Distance Flown,
# Departure, Destination, Unit of Measurement). Used by the automatic
# screenshot-based logger to avoid double-logging a flight that was
# already entered by hand through the manual Flight Logger form — see
# fetchLoggedFlights() in src/index.js and matchesManualLog() in
# src/autoflightlog.js.
LOG_SHEET_GID = "560263512"

# Set these with the wrangler CLI (never commit real secrets to git):
#   wrangler secret put DISCORD_CLIENT_SECRET
#   wrangler secret put SESSION_SECRET
#   wrangler secret put FLIGHT_SUBMIT_WEBHOOK_URL
#   wrangler secret put WISPBYTE_BASE_URL
# FLIGHT_SUBMIT_WEBHOOK_URL is where submitted flights get forwarded to
# (see src/flightSubmit.js) — point it at whatever actually records them.
#
# WISPBYTE_BASE_URL only needs to serve POST {base}/flight-log (used by
# both the manual logger and the automatic logger's confirm step) — it
# no longer needs an /fdr-data endpoint. The automatic logger now reads
# FDR data straight from screenshots the pilot uploads (see
# src/imageocr.js / src/autoflightlog.js) instead of calling out to
# Wispbyte for it.
#
# src/imageocr.js reads those screenshots via an outside vision API —
# pick a provider with (defaults to "gemini" if unset, since it's the
# only one of the three with a genuinely free tier):
#   wrangler secret put IMAGE_OCR_PROVIDER   # "gemini", "openai", or "anthropic"
# then set that provider's key:
#   wrangler secret put GEMINI_API_KEY       # aistudio.google.com/apikey (free)
#   wrangler secret put GEMINI_MODEL         # optional, defaults to "gemini-3.5-flash"
#   wrangler secret put OPENAI_API_KEY       # console.openai.com
#   wrangler secret put OPENAI_MODEL         # optional, defaults to "gpt-5.5"
#   wrangler secret put ANTHROPIC_API_KEY    # console.anthropic.com
#   wrangler secret put ANTHROPIC_MODEL      # optional, defaults to "claude-sonnet-5"
# Only the key(s) for whichever provider you pick are actually needed.
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Per-pilot dashboard settings (units, swap-after-log, light/dark theme,
# manual/automatic logging mode) are stored in Workers KV — see
# src/settingssave.js.
# Create the namespace once with the wrangler CLI, then paste the id(s)
# below:
#   wrangler kv namespace create SETTINGS_KV
#   wrangler kv namespace create SETTINGS_KV --preview
[[kv_namespaces]]
binding = "SETTINGS_KV"
id = "e128530e6ef947bbb09fc18f768e0d88"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# Which FDR "Usage" ids have already been auto-logged (key prefix
# "usageid:"), and short-lived "detect -> confirm" batches of
# screenshot-derived flights (key prefix "autobatch:", ~15 min TTL) —
# see src/autoflightlog.js — live in their own namespace, separate from
# SETTINGS_KV, so a flight can never get logged twice and a confirm
# step never has to trust flight details sent back by the browser.
# Create the namespace once with the wrangler CLI, then paste the id(s)
# below:
#   wrangler kv namespace create AUTO_LOG_KV
#   wrangler kv namespace create AUTO_LOG_KV --preview
[[kv_namespaces]]
binding = "AUTO_LOG_KV"
id = "4f8ecd4837544c349498840cfcf10ec6"
preview_id = "REPLACE_WITH_AUTO_LOG_KV_PREVIEW_NAMESPACE_ID"

# OCR_RELAY (see src/ocrrelay.js) pins the outbound Gemini/OpenAI/
# Anthropic API call made by src/imageocr.js to a fixed, provider-
# supported region (Western North America), instead of letting it run
# from whatever Cloudflare edge colo happened to handle the pilot's
# request. Without this, pilots whose requests land on Cloudflare's
# Hong Kong colo (HKG) — common for Southeast Asia — get a 400 "User
# location is not supported for the API use." from Gemini even though
# nothing is actually wrong with their screenshot or the API key.
# No IDs to fill in here — Durable Object bindings just need the class
# name, and the [[migrations]] block below registers that class the
# first time you deploy.
[[durable_objects.bindings]]
name = "OCR_RELAY"
class_name = "OcrRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OcrRelay"]
