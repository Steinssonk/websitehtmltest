<!-- Shared site header — fully self-contained (markup + styles).
     Fetched client-side by every page via /site-chrome.js and injected
     into <div id="header-placeholder">. Edit this one file to change
     the header everywhere; nothing else needs to change. -->
<style>
  #header-placeholder, #header-placeholder * { box-sizing: border-box; }

  #header-placeholder nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 76px;
    padding: 0 6%;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;
    background-color: #012B7A;
    box-shadow: 0 2px 16px rgba(1, 20, 58, 0.18);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Logo + nav links grouped together on the left, right next to
     each other — the right side of the nav is reserved for the
     account/auth controls only. */
  #header-placeholder .nav-left {
    display: flex;
    align-items: center;
    gap: 2.6rem;
    min-width: 0;
  }

  #header-placeholder .logo {
    display: flex;
    align-items: center;
    text-decoration: none;
    flex-shrink: 0;
  }

  #header-placeholder .brand-logo {
    height: 42px;
    width: auto;
    max-width: 170px;
    object-fit: contain;
    display: block;
  }

  #header-placeholder .nav-links {
    display: flex;
    gap: 2.1rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  #header-placeholder .nav-links a {
    text-decoration: none;
    color: rgba(255, 255, 255, 0.75);
    font-weight: 500;
    font-size: 0.92rem;
    white-space: nowrap;
    transition: color 0.15s ease;
  }
  #header-placeholder .nav-links a:hover,
  #header-placeholder .nav-links a.current {
    color: #fff;
  }

  #header-placeholder .nav-right {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    flex-shrink: 0;
  }

  #header-placeholder .user-badge {
    display: none;
    align-items: center;
    gap: 0.6rem;
  }
  #header-placeholder .user-badge img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }
  #header-placeholder .user-badge span {
    font-weight: 600;
    color: #fff;
    font-size: 0.9rem;
  }

  #header-placeholder .btn {
    background-color: #16181B;
    color: #fff;
    border: none;
    padding: 0.65rem 1.35rem;
    border-radius: 15px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.92rem;
    text-decoration: none;
    display: inline-block;
    font-family: 'Inter', sans-serif;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  #header-placeholder .btn:hover {
    background-color: #001D52;
    transform: translateY(-1px);
  }

  /* Mobile nav toggle + menu — also part of the header component, so
     they live here rather than in each page. */
  .nav-toggle {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: flex-end;
    gap: 5px;
    width: 32px;
    height: 32px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    z-index: 210;
  }
  .nav-toggle span {
    display: block;
    height: 2px;
    border-radius: 2px;
    background: #fff;
    transition: transform 0.25s ease, opacity 0.2s ease, width 0.2s ease, background 0.2s ease;
  }
  .nav-toggle span:nth-child(1) { width: 22px; }
  .nav-toggle span:nth-child(2) { width: 16px; }
  .nav-toggle span:nth-child(3) { width: 22px; }
  .nav-toggle.is-active span { width: 22px; background: #16181B; }
  .nav-toggle.is-active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-toggle.is-active span:nth-child(2) { opacity: 0; }
  .nav-toggle.is-active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .mobile-menu {
    position: fixed;
    inset: 0;
    background: #dfe2eb;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2rem;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-12px);
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .mobile-menu.is-open { opacity: 1; visibility: visible; transform: translateY(0); }
  .mobile-menu ul { list-style: none; display: flex; flex-direction: column; align-items: center; gap: 1.7rem; margin: 0; padding: 0; }
  .mobile-menu ul a { text-decoration: none; color: #16181B; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
  .mobile-menu ul a.current { color: #012B7A; }
  .mobile-menu .btn { font-size: 0.95rem; }
  body.menu-open { overflow: hidden; }

  @media (max-width: 980px) {
    #header-placeholder .nav-links { display: none; }
    .nav-toggle { display: flex; }
  }
  @media (min-width: 981px) {
    .mobile-menu { display: none; }
  }
</style>

<nav>
    <div class="nav-left">
        <a href="/" class="logo">
            <img class="brand-logo" src="https://i.imgur.com/WLsUaNg.png" alt="Udyanapura">
        </a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/programs">Programs</a></li>
            <li><a href="/hubs">Hubs</a></li>
            <li><a href="/fleet">Fleet</a></li>
            <li><a href="/dashboard">Dashboard</a></li>
        </ul>
    </div>
    <div class="nav-right">
        <span id="user-badge" class="user-badge">
            <img id="user-avatar" src="" alt="">
            <span id="user-name"></span>
        </span>
        <a id="auth-btn" class="btn" href="/auth/discord">Get Started</a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
    </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/programs">Programs</a></li>
        <li><a href="/hubs">Hubs</a></li>
        <li><a href="/fleet">Fleet</a></li>
        <li><a href="/dashboard">Dashboard</a></li>
    </ul>
    <a id="mobile-auth-btn" class="btn btn-dark" href="/auth/discord">Get Started</a>
</div>
