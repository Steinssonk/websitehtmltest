<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Website - Biofarma Theme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styles & Biofarma Design Tokens */
        :root {
            --primary-color: #01373d; /* Deep Teal */
            --accent-color: #ce1a4d;  /* Crimson/Red-Pink */
            --border-color: #d3ccff;  /* Light Periwinkle */
            --bg-color: #ffffff;      /* Clean White */
            --text-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', sans-serif;
        }

        body {
            color: var(--text-color);
            background-color: var(--bg-color); 
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: var(--bg-color);
            box-shadow: 0 1px 0 var(--border-color); /* Subtle border matching theme */
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .header-btn, .card-btn {
            padding: 10px 24px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .header-btn:hover, .card-btn:hover {
            background-color: #a7123d; /* Slightly darker accent on hover */
            transform: translateY(-2px);
        }

        /* Hero Section (Fading Image) */
        .hero {
            height: 75vh;
            width: 100%;
            /* Uses the requested Imgur link and fades into the white background */
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 40%, rgba(255, 255, 255, 1) 100%),
                        url('https://imgur.com/3zx6eLm.png') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* About Section */
        .about {
            text-align: center;
            padding: 20px 20px 80px;
            background-color: var(--bg-color);
        }

        .about h2 {
            font-size: 52px;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--primary-color);
            letter-spacing: -1px;
        }

        .about p {
            font-size: 22px;
            color: var(--text-color);
            text-transform: lowercase;
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        /* Cards Section */
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 0 5% 100px;
            background-color: var(--bg-color);
            flex-wrap: wrap;
        }

        .card {
            border-radius: 12px;
            overflow: hidden;
            width: 320px;
            box-shadow: 0 15px 30px rgba(1, 55, 61, 0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            border: 1px solid rgba(211, 204, 255, 0.4); /* Faint periwinkle border */
        }

        .card:hover {
            transform: translateY(-8px);
        }

        /* Solid, Non-Pastel Card Backgrounds */
        .card-1 { background-color: var(--primary-color); } 
        .card-2 { background-color: #02535c; } /* Lighter Teal */
        .card-3 { background-color: #ffffff; border: 2px solid var(--primary-color); } /* High contrast white */

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 3px solid var(--accent-color);
        }

        .card-content {
            padding: 30px 24px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Adjust button styles based on card background for contrast */
        .card-3 .card-btn {
            background-color: var(--primary-color);
        }
        .card-3 .card-btn:hover {
            background-color: var(--accent-color);
        }

        /* Responsive Design for smaller screens */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }
            .cards-container {
                flex-direction: column;
                align-items: center;
            }
            .hero {
                height: 50vh; /* Shorter hero on mobile */
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Logo</div>
        <nav>
            <a href="#">Pages</a>
            <a href="#">Middle</a>
            <a href="#">Here</a>
        </nav>
        <button class="header-btn">Action</button>
    </header>

    <main>
        <section class="hero"></section>

        <section class="about">
            <h2>About Us</h2>
            <p>all about us</p>
        </section>

        <section class="cards-container">
            
            <div class="card card-1">
                <img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?q=80&w=600&auto=format&fit=crop" alt="Card Image 1">
                <div class="card-content">
                    <button class="card-btn">Button</button>
                </div>
            </div>

            <div class="card card-2">
                <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=600&auto=format&fit=crop" alt="Card Image 2">
                <div class="card-content">
                    <button class="card-btn">Button</button>
                </div>
            </div>

            <div class="card card-3">
                <img src="https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?q=80&w=600&auto=format&fit=crop" alt="Card Image 3">
                <div class="card-content">
                    <button class="card-btn">Button</button>
                </div>
            </div>

        </section>
    </main>

</body>
</html>
