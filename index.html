<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Corporate Page</title>
    <style>
        /* CSS Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            line-height: 1.6;
        }

        /* --- Header Styles --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: #ffffff;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #111111;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #555555;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #000000;
        }

        .header-btn {
            padding: 10px 24px;
            background-color: #111111;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .header-btn:hover {
            background-color: #444444;
        }

        /* --- Main Layout Styles --- */
        main {
            padding: 40px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Main Image Placeholder */
        .hero-image-container {
            width: 100%;
            height: 400px;
            background-color: #f5f5f5;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- 3 Boxes Section --- */
        .boxes-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .box {
            padding: 30px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .box:hover {
            transform: translateY(-5px);
        }

        /* Theme Colors applied to boxes */
        .box-1 { background-color: #F8E4E5; } /* Light Pink from theme */
        .box-2 { background-color: #EAF1FE; } /* Light Blue from theme */
        .box-3 { background-color: #F4F4F4; } /* Neutral Gray to complement */

        .box-image-container {
            width: 100%;
            height: 200px;
            background-color: #ffffff;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .box-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .box h3 {
            margin-bottom: 15px;
            font-size: 1.25rem;
        }

        .box-btn {
            margin-top: auto; /* Pushes button to the bottom */
            padding: 10px 20px;
            background-color: #ffffff;
            color: #111111;
            border: 1px solid #111111;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .box-btn:hover {
            background-color: #111111;
            color: #ffffff;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">BrandLogo</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
        <button class="header-btn">Get Started</button>
    </header>

    <main>
        <div class="hero-image-container">
            <img src="https://via.placeholder.com/1200x400?text=Main+Image+Placeholder" alt="Hero Image">
        </div>

        <section class="boxes-section">
            
            <div class="box box-1">
                <div class="box-image-container">
                    <img src="https://via.placeholder.com/300x200?text=Image+1" alt="Box 1 Image">
                </div>
                <h3>Service One</h3>
                <button class="box-btn">Learn More</button>
            </div>

            <div class="box box-2">
                <div class="box-image-container">
                    <img src="https://via.placeholder.com/300x200?text=Image+2" alt="Box 2 Image">
                </div>
                <h3>Service Two</h3>
                <button class="box-btn">Learn More</button>
            </div>

            <div class="box box-3">
                <div class="box-image-container">
                    <img src="https://via.placeholder.com/300x200?text=Image+3" alt="Box 3 Image">
                </div>
                <h3>Service Three</h3>
                <button class="box-btn">Learn More</button>
            </div>

        </section>
    </main>

</body>
</html>
